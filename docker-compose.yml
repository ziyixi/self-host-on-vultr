# * =============================================== global networks and volumes =============================================== * #
networks:
  allexport:
  unami:
  # No published ports; this bridge still permits outbound provider requests.
  newsletter:

# Replace only with a tested, immutable newsletter image when upgrading.
x-newsletter-image: &newsletter-image ghcr.io/ziyixi/newsletter@sha256:ce0ba6717bd70eeb276608b655eb979730f9005bf9a3c5f7d173d0202ad2c110

volumes: {}

services:
  # * =============================================== newsletter =============================================== * #
  newsletter:
    image: *newsletter-image
    platform: linux/amd64
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - path: ./env/newsletter.env
        format: raw
    environment:
      NEWSLETTER_DATA_DIR: /var/lib/newsletter
      NEWSLETTER_CODEX_HOME: /var/lib/newsletter-auth
    volumes:
      - type: bind
        source: ./data/newsletter
        target: /var/lib/newsletter
        bind:
          create_host_path: false
      # Outside ./env and ./data: the existing backup service reads both.
      - type: bind
        source: /home/xiziyi/.local/share/newsletter/codex-auth
        target: /var/lib/newsletter-auth
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    mem_limit: 1536m
    cpus: 2
    pids_limit: 128
    stop_grace_period: 60s
    networks: [newsletter]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  newsletter-trigger:
    # Built natively on the Linux server, using the same immutable service client.
    image: local/newsletter-trigger:service
    platform: linux/amd64
    build:
      context: ./newsletter-trigger
      args:
        NEWSLETTER_IMAGE: *newsletter-image
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - path: ./env/newsletter-trigger.env
        format: raw
    environment:
      TZ: UTC
      NEWSLETTER_TIME_ZONE: America/Los_Angeles
      NEWSLETTER_SERVICE_URL: http://newsletter:8080
      NEWSLETTER_ALLOW_INTERNAL_HTTP: "1"
    depends_on:
      newsletter:
        condition: service_healthy
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m,mode=1777
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    stop_grace_period: 65s
    networks: [newsletter]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # * =============================================== unami =============================================== * #
  unami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: unami
    ports:
      - "10001:3000"
    environment:
      DATABASE_URL: postgresql://umami:umami@unami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: randomhashsalt
    depends_on:
      - unami-db
    restart: always
    networks:
      - allexport
      - unami

  unami-db:
    image: postgres:15-alpine
    container_name: unami-db
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    volumes:
      - ./data/unami:/var/lib/postgresql/data
    restart: always
    networks:
      - unami

  # * =============================================== todofy =============================================== * #
  todofy:
    image: ghcr.io/ziyixi/todofy:latest
    container_name: todofy
    ports:
      - "10003:8080"
    restart: always
    env_file: ./env/todofy.env
    networks:
      - allexport

  todofy-llm:
    image: ghcr.io/ziyixi/todofy-llm:latest
    container_name: todofy-llm
    restart: always
    env_file: ./env/todofy.env
    depends_on:
      - todofy
    networks:
      - allexport

  todofy-todo:
    image: ghcr.io/ziyixi/todofy-todo:latest
    container_name: todofy-todo
    restart: always
    env_file: ./env/todofy.env
    depends_on:
      - todofy
    networks:
      - allexport

  todofy-database:
    image: ghcr.io/ziyixi/todofy-database:latest
    container_name: todofy-database
    restart: always
    env_file: ./env/todofy.env
    volumes:
      - ./data/todofy:/root
    depends_on:
      - todofy
    networks:
      - allexport

  # * =============================================== stirling-pdf =============================================== * #
  stirling:
    image: frooodle/s-pdf:latest
    container_name: stirling
    ports:
      - "10005:8080"
    restart: always
    volumes:
      - ./env/stirling:/configs
      - ./data/stirling_logs:/logs/
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - INSTALL_BOOK_AND_ADVANCED_HTML_OPS=false
      - LANGS=en_US
      - DOCKER_ENABLE_SECURITY=true
      - SECURITY_ENABLE_LOGIN=true
    networks:
      - allexport

  # * =============================================== slash =============================================== * #
  slash:
    image: yourselfhosted/slash:latest
    container_name: slash
    ports:
      - "10006:5231"
    volumes:
      - ./data/slash:/var/opt/slash
    restart: unless-stopped
    networks:
      - allexport

  # * =============================================== flowday =============================================== * #
  flowday:
    image: ghcr.io/ziyixi/flowday:latest
    container_name: flowday
    ports:
      - "10008:3000"
    volumes:
      - ./data/flowday:/app/db
    restart: unless-stopped
    networks:
      - allexport

  # * =============================================== backup =============================================== * #
  backup:
    image: offen/docker-volume-backup:v2.43.0
    restart: always
    env_file: ./env/backup.env
    volumes:
      - ./data:/backup/data:ro
      - ./env:/backup/env:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
